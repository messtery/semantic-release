version: 2.1

# Release only runs when triggered with release=true
# (CircleCI UI "Trigger Pipeline" or the API); pushes don't release.
parameters:
  release:
    type: boolean
    default: false

jobs:
  release:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run: npx semantic-release

workflows:
  release:
    when: << pipeline.parameters.release >>
    jobs:
      - release
