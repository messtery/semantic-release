version: 2.1

jobs:
  release:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run: npx semantic-release

workflows:
  release:
    jobs:
      # Every push to main waits here; approve the latest one to release
      # all commits stacked since the last tag.
      - hold:
          type: approval
          filters:
            branches:
              only: main
      - release:
          requires:
            - hold
          filters:
            branches:
              only: main
